version: v1
experiment_id: web-agent-e2b-five-public-nexau
description: Five deterministic local-fixture Web cases for the public NexAU migration.
controller:
  managed_local: true
  local_host: 127.0.0.1
  local_port: 8885
  public_url: ""
  token: ""
  app_config_path: config/app.web.e2b.yaml
  insecure_dev_no_auth: false
  # Release evidence is intentionally serial: GPT-5.5 evaluators keep a
  # sandbox leased for several minutes, and parallel E2B allocation can churn
  # otherwise healthy HK sandboxes before model execution begins. Controller
  # concurrency remains covered by the fault-injection and process suites.
  parallelism: 1
  runner_workers: 1
  worker_queue_max: 2
sandbox:
  provider: e2b
  template: fixture-web-candidate
  allocation_strategy: ephemeral_per_task
  desktop: true
  platform: linux
  resolution: [1280, 900]
  device_python: python3.12
  resources:
    cpu_count: 2
    memory_mb: 4096
    timeout_seconds: 12000
  metadata:
    suite: web-agent-e2b-five-public-nexau
    template_alias: fixture-web-candidate
    dataset: none
runtime:
  mode: upload_wheels
concurrency: 1
trace_expectations:
  evaluator_kind: web_round_evaluator
tasks:
  - task_id: web-five-info-lookup
    app_profile: chrome
    agent_kind: web
    query: Open the local NorthCUA docs fixture. Find the renewal confirmation code and finish with only that code.
    max_steps: 12
    max_session_steps: 12
    timeout_seconds: 12000
    max_retries: 1
    fixtures:
      - source_path: ../fixtures/web-e2b-three/info/index.html
        remote_path: /tmp/northcua-web-e2b-five/info/index.html
        mode: "0644"
      - source_path: ../fixtures/web-e2b-three/info/license.html
        remote_path: /tmp/northcua-web-e2b-five/info/license.html
        mode: "0644"
    startup_commands:
      - label: start-web-five-info-fixture
        command: |
          bash -lc 'set -euo pipefail
          python3.12 -m http.server 8761 --bind 127.0.0.1 --directory /tmp/northcua-web-e2b-five/info >/tmp/northcua-web-e2b-five/info/http.log 2>&1 &
          sleep 1
          python3.12 -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8761/index.html\", timeout=5).read()"'
        timeout_seconds: 30
    metadata:
      url: http://127.0.0.1:8761/index.html
      headed: false
      expected_answer: PRISM-2479
      synthetic_case: true
  - task_id: web-five-form-state
    app_profile: chrome
    agent_kind: web
    query: Open the local dynamic form. Fill Full name as Ada Lovelace, choose Enterprise, check the agreement box, submit, and finish with the confirmation id.
    max_steps: 18
    max_session_steps: 18
    timeout_seconds: 12000
    max_retries: 1
    fixtures:
      - source_path: ../fixtures/web-e2b-three/form/index.html
        remote_path: /tmp/northcua-web-e2b-five/form/index.html
        mode: "0644"
    startup_commands:
      - label: start-web-five-form-fixture
        command: |
          bash -lc 'set -euo pipefail
          python3.12 -m http.server 8762 --bind 127.0.0.1 --directory /tmp/northcua-web-e2b-five/form >/tmp/northcua-web-e2b-five/form/http.log 2>&1 &
          sleep 1
          python3.12 -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8762/index.html\", timeout=5).read()"'
        timeout_seconds: 30
    metadata:
      url: http://127.0.0.1:8762/index.html
      headed: false
      expected_answer: WEB-FORM-314
      synthetic_case: true
  - task_id: web-five-tabs-navigation
    app_profile: chrome
    agent_kind: web
    query: Open the local tab launcher. Open the details page in a new tab, focus it if needed, find the launch window, and finish with the launch window.
    max_steps: 18
    max_session_steps: 18
    timeout_seconds: 12000
    max_retries: 1
    fixtures:
      - source_path: ../fixtures/web-e2b-three/tabs/index.html
        remote_path: /tmp/northcua-web-e2b-five/tabs/index.html
        mode: "0644"
      - source_path: ../fixtures/web-e2b-three/tabs/details.html
        remote_path: /tmp/northcua-web-e2b-five/tabs/details.html
        mode: "0644"
    startup_commands:
      - label: start-web-five-tabs-fixture
        command: |
          bash -lc 'set -euo pipefail
          python3.12 -m http.server 8763 --bind 127.0.0.1 --directory /tmp/northcua-web-e2b-five/tabs >/tmp/northcua-web-e2b-five/tabs/http.log 2>&1 &
          sleep 1
          python3.12 -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8763/index.html\", timeout=5).read()"'
        timeout_seconds: 30
    metadata:
      url: http://127.0.0.1:8763/index.html
      headed: false
      expected_answer: 09:30 UTC
      synthetic_case: true
  - task_id: web-five-actionability-click
    app_profile: chrome
    agent_kind: web
    query: Open the local actionability fixture. Click the enabled OK button and finish with only the button text after the click.
    max_steps: 12
    max_session_steps: 12
    timeout_seconds: 12000
    max_retries: 1
    fixtures:
      - source_path: ../fixtures/web-e2b-three/actionability/index.html
        remote_path: /tmp/northcua-web-e2b-five/actionability-click/index.html
        mode: "0644"
    startup_commands:
      - label: start-web-five-actionability-click
        command: |
          bash -lc 'set -euo pipefail
          python3.12 -m http.server 8764 --bind 127.0.0.1 --directory /tmp/northcua-web-e2b-five/actionability-click >/tmp/northcua-web-e2b-five/actionability-click/http.log 2>&1 &
          sleep 1
          python3.12 -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8764/index.html\", timeout=5).read()"'
        timeout_seconds: 30
    metadata:
      url: http://127.0.0.1:8764/index.html
      headed: false
      expected_answer: OK
      synthetic_case: true
  - task_id: web-five-actionability-input
    app_profile: chrome
    agent_kind: web
    query: Open the local actionability fixture. Enter Grace Hopper in the Name field and finish with only the entered name.
    max_steps: 12
    max_session_steps: 12
    timeout_seconds: 12000
    max_retries: 1
    fixtures:
      - source_path: ../fixtures/web-e2b-three/actionability/index.html
        remote_path: /tmp/northcua-web-e2b-five/actionability-input/index.html
        mode: "0644"
    startup_commands:
      - label: start-web-five-actionability-input
        command: |
          bash -lc 'set -euo pipefail
          python3.12 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/northcua-web-e2b-five/actionability-input >/tmp/northcua-web-e2b-five/actionability-input/http.log 2>&1 &
          sleep 1
          python3.12 -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8765/index.html\", timeout=5).read()"'
        timeout_seconds: 30
    metadata:
      url: http://127.0.0.1:8765/index.html
      headed: false
      expected_answer: Grace Hopper
      synthetic_case: true
metadata:
  suite_family: public-nexau-migration
  deterministic_local_fixtures: true
  excludes_webarena_verified: true
