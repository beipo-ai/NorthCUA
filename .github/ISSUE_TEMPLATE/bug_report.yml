name: Bug report
description: Report a reproducible execution, installation, or documentation problem.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: NorthCUA commit, OS, Python, installation method and execution mode.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal task, command and redacted configuration. Do not include credentials.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant error or small trace excerpt. Remove private screenshots and file contents.
