name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NO_PROXY: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
      - run: uv sync --locked --extra local --extra device --extra dev --extra e2b --extra viewer
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright --pythonpath .venv/bin/python
      - run: uv run --no-sync pytest -q --junitxml=reports/contracts.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contracts-${{ github.sha }}
          path: reports/
  browser-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NO_PROXY: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth xclip python3-tk scrot wmctrl
      - run: uv sync --locked --python python --extra local --extra device --extra dev
      - run: uv run --no-sync playwright install --with-deps chromium
      - name: Create test artifact directory
        run: mkdir -p reports
      - name: Real browser, local model, live evaluation and both controller modes
        run: uv run --no-sync pytest tests/integration/test_web_modes.py -q --basetemp=reports/web-modes --junitxml=reports/web.xml
        env:
          NORTHCUA_RUN_BROWSER_TESTS: '1'
      - name: Real browser tool regressions
        run: uv run --no-sync python -m tests.support.web_agent_playwright_e2e --local-fixtures --fail-on-error --output reports/browser-tools.json
      - name: Public local batch tutorial with real workers and resume
        run: uv run --no-sync pytest tests/integration/test_local_batch.py -q --basetemp=reports/local-batch --junitxml=reports/local-batch.xml
        env:
          NORTHCUA_RUN_BROWSER_TESTS: '1'
      - name: Physical input on an isolated X11 display
        run: xvfb-run -a uv run --no-sync pytest tests/integration/test_native_desktop.py -q --junitxml=reports/native.xml
        env:
          NORTHCUA_RUN_NATIVE_TESTS: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-${{ github.sha }}
          path: reports/
  wheels:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python -m scripts.build_wheelhouse
      - name: Wheel-only install without NexAU, then with the pinned runtime
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" wheelhouse/*.whl
          smoke="$GITHUB_WORKSPACE/tests/support/wheel_smoke.py"
          wheels="$GITHUB_WORKSPACE/wheelhouse"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" "$smoke" --wheelhouse "$wheels"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" --find-links "$wheels" 'northcua[local]==0.2.0' 'nexau @ git+https://github.com/hzhua/nexau.git@28511d9f0362191a6c378fd441b2be55309a9e32'
          "$RUNNER_TEMP/wheel-smoke/bin/python" "$smoke" --wheelhouse "$wheels" --with-nexau
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" pip
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip check
      - name: Execute tasks from installed wheels outside the checkout
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          NORTHCUA_RUN_BROWSER_TESTS: '1'
        run: |
          python="$RUNNER_TEMP/wheel-smoke/bin/python"
          uv pip install --python "$python" pytest pytest-asyncio
          "$python" -m playwright install --with-deps chromium
          cp tests/integration/test_web_modes.py "$RUNNER_TEMP/test_installed_web_modes.py"
          cp tests/integration/test_local_batch.py "$RUNNER_TEMP/test_installed_local_batch.py"
          cd "$RUNNER_TEMP"
          "$python" -m pytest test_installed_web_modes.py test_installed_local_batch.py -q --junitxml=installed-web.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.os == 'ubuntu-24.04'
        with:
          name: installed-tasks-${{ github.sha }}
          path: ${{ runner.temp }}/installed-web.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: wheelhouse-${{ github.sha }}
          path: wheelhouse/*.whl
          if-no-files-found: error
