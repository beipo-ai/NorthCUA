# Harness settings only. The caller attaches its already-prepared desktop.
agent_config_path: agent.yaml
artifacts:
  root_dir: logs/osworld1
execution:
  max_agent_iterations_per_round: 100
  no_tool_call_attempts: 1
  model_response_recovery: true
  enable_in_memory_tracer: true
  enable_langfuse_tracer: false
evaluation:
  enabled: false
desktop:
  backend: osworld
  coordinate_policy:
    input_space: normalized_1000
    clamp_to_bounds: false
prompt:
  system_prompt_profile: osworld1_formal
  history_window_rounds: 100
  screenshot_window_images: 3
  history_action_trace_enabled: true
  history_action_trace_include_initial: true
  history_action_trace_badges: true
  history_action_trace_max_badge_text: 32
  include_initial_observation_image: true
  include_subsequent_observation_images: true
