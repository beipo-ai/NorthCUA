# Recommended settings for the ordinary local Desktop Harness.
agent_config_path: agent.yaml
artifacts:
  root_dir: logs/long-context
execution:
  max_agent_iterations_per_round: 500
  no_tool_call_attempts: 3
  enable_in_memory_tracer: true
  enable_langfuse_tracer: false
evaluation:
  enabled: false
context_management:
  mode: enforce
  budget:
    soft_trigger_ratio: 0.7
    target_ratio: 0.55
    safety_margin_ratio: 0.08
    safety_margin_min_tokens: 4096
    recent_iterations: 4
  summary:
    model:
      source: agent_config
      agent_config_path: summary-agent.yaml
    max_output_tokens: 2048
    timeout_seconds: 300
    total_deadline_seconds: 900
    max_chunks: 4
    max_calls: 12
desktop:
  backend: native
  coordinate_policy:
    input_space: normalized_1000
    clamp_to_bounds: true
prompt:
  history_window_rounds: 500
  screenshot_window_images: 3
  history_action_trace_enabled: true
  history_action_trace_include_initial: true
  history_action_trace_badges: true
  include_initial_observation_image: true
  include_subsequent_observation_images: true
