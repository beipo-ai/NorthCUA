[project]
name = "northcua-runtime-shared"
version = "0.2.0"
description = "Shared runtime registries and protocols for NorthCUA"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "northcua-protocol==0.2.0",
  "pydantic>=2.7",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["northcua_runtime_shared", "northcua_runtime_shared.*"]

[project.urls]
Repository = "https://github.com/beipo-ai/NorthCUA"
Documentation = "https://github.com/beipo-ai/NorthCUA/blob/main/docs/README.md"
Issues = "https://github.com/beipo-ai/NorthCUA/issues"
Changelog = "https://github.com/beipo-ai/NorthCUA/blob/main/CHANGELOG.md"
